name: README widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate-readme-widgets.mjs
      - .github/workflows/readme-widgets.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dynamic widgets
        run: npm run readme:widgets
        env:
          README_APP_URL: https://papo-reto-beige.vercel.app

      - name: Install preview browser
        run: npx playwright install --with-deps chromium

      - name: Capture production preview
        run: npm run readme:preview
        env:
          README_APP_URL: https://papo-reto-beige.vercel.app

      - name: Upload README assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-assets
          path: docs/readme
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download README assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-assets
          path: docs/readme

      - name: Commit updated README assets
        run: |
          if [ -z "$(git status --porcelain -- docs/readme)" ]; then
            echo "No README asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/readme
          git commit -m "Update README dynamic assets"
          git push
